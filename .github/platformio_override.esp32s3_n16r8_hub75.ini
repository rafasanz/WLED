[env:esp32s3_n16r8_hub75]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
platform = ${esp32s3.platform}
platform_packages = ${esp32s3.platform_packages}
upload_speed = 921600
build_unflags = ${common.build_unflags}
custom_usermods = audioreactive
build_flags = ${common.build_flags} ${esp32s3.build_flags} -D WLED_RELEASE_NAME=\"ESP32-S3_N16R8_HUB75\"
  -D WLED_WATCHDOG_TIMEOUT=0
  -D ARDUINO_USB_CDC_ON_BOOT=0 ;; use the USB-to-UART port for the most reliable flashing/logging path
  -DBOARD_HAS_PSRAM
  -DLOLIN_WIFI_FIX
  -D WLED_ENABLE_HUB75MATRIX -D NO_GFX
  -D LED_TYPES=TYPE_HUB75MATRIX_HS
  -D S3_LCD_DIV_NUM=20 ;; improves Wi-Fi stability on some ESP32-S3 boards while HUB75 is active
  -D ESP32S3_N16R8_DUALUSB_HUB75_PINOUT
  -D WLED_DEBUG_BUS
  -D LEDPIN=14 -D BTNPIN=0 -D RLYPIN=15 -D IRPIN=-1 -D AUDIOPIN=-1 ;; keep default features away from HUB75 pins
  -D SR_DMTYPE=1 -D I2S_SDPIN=-1 -D I2S_CKPIN=-1 -D I2S_WSPIN=-1 -D MCLK_PIN=-1 ;; disable I2S audio pin allocation

lib_deps = ${esp32s3.lib_deps}
  ${hub75.lib_deps}

board_build.partitions = ${esp32.extreme_partitions}
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.f_flash = 80000000L
board_build.flash_mode = qio
monitor_filters = esp32_exception_decoder
